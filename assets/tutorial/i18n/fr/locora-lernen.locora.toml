at = [0.2, 0.75]
image = "brunnen.sply"
answer = { type = "quiz", options = [
  { text = "Toujours 4, ça va plus vite", correct = false },
  { text = "Honnêtement, de 1 à 4", correct = true },
  { text = "Pas du tout", correct = false },
] }

[[room.locus]]
place = "L’arbre – avec quelle commande crées-tu ton propre palais ?"
item = "locora new"
at = [0.55, 0.6]
image = "baum.sply"
answer = { type = "guess", accept = ["new", "locora new NAME"] }
note = "Un nouveau palais pousse de l’arbre – « new » est écrit sur le panneau du tronc"

[[room.locus]]
place = "La luciole – avec quoi t’entraînes-tu sur ce qui est dû ?"
