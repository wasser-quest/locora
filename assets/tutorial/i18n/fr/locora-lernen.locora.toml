at = [0.6, 0.75]
image = "leseplatz.sply"

[[room.locus]]
place = "L’horloge – quand révises-tu ?"
item = "Juste avant d’oublier"
at = [0.82, 0.12]
image = "uhr.sply"

[[room]]
name = "Jardin"
image = "garten.sply"

[[room.locus]]
place = "La fontaine – comment évalues-tu une réponse ?"
