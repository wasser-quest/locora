# Das Tutorial: Locora mit der Loci-Methode lernen.
# Jeder Ort zeigt eine animierte Grafik (.sply), die die App mit der Splinely-Runtime abspielt.
# Bauen: locora tutorial (oder locora build assets/tutorial/locora-lernen.locora.toml)

name = "Apprendre Locora"

[[room]]
name = "Hall d’entrée"
image = "halle.sply"

[[room.locus]]
place = "La porte – qu’est-ce qu’un palais de mémoire ?"
item = "Un lieu que tu connais bien"
at = [0.5, 0.45]
image = "../mascot/simo.sply"

[[room.locus]]
place = "Le tapis – qu’est-ce qui fixe l’ordre ?"
item = "Le parcours à travers les lieux"
at = [0.5, 0.88]
image = "teppich.sply"

[[room.locus]]
place = "La lanterne – que places-tu à chaque endroit ?"
item = "Une image vivante"
at = [0.82, 0.3]
image = "laterne.sply"

[[room]]
name = "Bibliothèque"
image = "bibliothek.sply"

[[room.locus]]
place = "L’étagère – quelles images restent ?"
item = "Plus c’est bizarre, mieux c’est"
at = [0.3, 0.4]
image = "regal.sply"

[[room.locus]]
place = "La place de lecture – comment t’entraînes-tu ?"
