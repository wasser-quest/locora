<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Android adaptive-icon background: the logo's gradient. The layer is 108 dp, launchers show
       its central 72 dp (1/6 to 5/6), so the gradient spans exactly that; the bleed keeps the end
       colours (spread pad). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0.16667" x2="0" y2="0.83333">
      <stop offset="0" stop-color="#3a3d92"/>
      <stop offset="1" stop-color="#14153d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
</svg>
