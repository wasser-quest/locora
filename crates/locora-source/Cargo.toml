[package]
name = "locora-source"
description = "locora.toml: memory palaces as human- and AI-friendly source files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
locora-api.workspace = true
locora-formula = { path = "../locora-formula" }
locora-media = { path = "../locora-media" }
locora-store = { path = "../locora-store" }
serde = { version = "1", features = ["derive"] }
sha2.workspace = true
thiserror.workspace = true
toml = "1"

[dev-dependencies]
locora-media = { path = "../locora-media", features = ["fixtures"] }
tempfile = "3"
