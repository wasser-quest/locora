[package]
name = "locora-app-core"
description = "The app's logic without Tauri: the home and palace views, and the journey. Shared by the desktop/phone app and the browser build."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
base64 = "0.22"
locora-api.workspace = true
locora-app-api = { path = "../../apps/app/shared" }
locora-competition = { path = "../locora-competition" }
infer = "0.22"
locora-cloud-api = { path = "../locora-cloud-api" }
locora-format = { path = "../locora-format" }
locora-media = { path = "../locora-media" }
locora-formula = { path = "../locora-formula" }
locora-source = { path = "../locora-source" }
locora-runtime = { path = "../locora-runtime", default-features = false }
locora-store = { path = "../locora-store" }
serde_json = "1"
splinely_document = { git = "https://github.com/wasser-quest/splinely", tag = "v0.5.2" }
url = "2"

[dev-dependencies]
locora-media = { path = "../locora-media", features = ["fixtures"] }
# The desktop's HTTP runner, for the tests that run the friends flows against a local server.
locora-runtime = { path = "../locora-runtime", features = ["cloud"] }
serde.workspace = true
tempfile = "3"
