[package]
name = "locora-runtime"
description = "Shared run time of the Locora CLI and app: profile, built-in plugins, answering loci"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
dirs = "6"
locora-api.workspace = true
locora-cloud-api = { path = "../locora-cloud-api" }
locora-crypto = { path = "../locora-crypto" }
locora-signing = { path = "../locora-signing" }
locora-host.workspace = true
locora-format = { path = "../locora-format" }
locora-fsrs = { path = "../locora-fsrs" }
locora-formula = { path = "../locora-formula" }
locora-source = { path = "../locora-source" }
locora-store = { path = "../locora-store" }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
url = "2"
sha2.workspace = true
percent-encoding = "2"
base64 = "0.22"

