[package]
name = "locora-store"
description = "Offline-first local storage for Locora: palaces, stages, loci, media, plugin data and an operation log"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
locora-api = { path = "../locora-api" }
locora-formula = { path = "../locora-formula" }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
