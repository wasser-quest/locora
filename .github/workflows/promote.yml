name: Promote testing to main

# `main` follows `testing`: when CI, the web preview and the mobile builds all passed for the same
# commit on `testing`, `main` is fast-forwarded to that commit. Nothing else ever moves `main`
# forward automatically, and it is never rewritten: a commit that is not a fast-forward is left for
# the maintainer. Releases stay manual (a `vX.Y.Z` tag on `main`).

on:
  workflow_run:
    workflows: [CI, Web preview, Mobile builds]
    types: [completed]
    branches: [testing]

concurrency:
  group: promote-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Fast-forward main
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: All checks of the commit passed
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ok=true
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=push&branch=testing")
          for name in "CI" "Web preview" "Mobile builds"; do
            id=$(jq -r --arg n "$name" '[.workflow_runs[] | select(.name == $n)] | sort_by(.created_at) | last | .id // empty' <<<"$runs")
            if [ -z "$id" ]; then echo "$name: missing"; ok=false; continue; fi
            # Every job must pass. Only a macOS job that never got a runner (cancelled before its
            # first step) does not block: macOS is built again in full for every release.
            bad=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '
              .jobs[] | select(.conclusion != "success" and .conclusion != "skipped")
              | select((.name | startswith("macos")) and .conclusion == "cancelled"
                       and ([.steps[]? | select(.conclusion == "success")] | length) == 0 | not)
              | "\(.name)=\(.conclusion)"')
            echo "$name: ${bad:-ok}"
            [ -z "$bad" ] || ok=false
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.checks.outputs.ok == 'true'
        with:
          fetch-depth: 0
      - name: Fast-forward main
        if: steps.checks.outputs.ok == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "main already contains $SHA."
          elif git merge-base --is-ancestor origin/main "$SHA"; then
            git push origin "$SHA:refs/heads/main"
            echo "main is now at ${SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::main has commits that testing lacks; not a fast-forward, left for the maintainer."
          fi
