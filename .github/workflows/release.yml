name: Release

# A tag `vX.Y.Z` on a commit of `main` builds the app for macOS (Apple silicon and Intel), Windows,
# Linux and Android, and the `locora` CLI for Linux, macOS and Windows, and publishes them as the
# GitHub release of that version. Each tag keeps its own
# release; a tag with a suffix (`v0.2.0-beta.1`) becomes a pre-release.
#
# Android is signed with the upload key when the repository secrets ANDROID_KEYSTORE_BASE64
# (`base64 -w0 upload.jks`) and ANDROID_KEYSTORE_PASSWORD are set; without them the release gets
# a debug-signed APK for testing instead. The Play Store bundle (.aab) is never published here.
# Desktop builds are not code-signed. iOS is an unsigned .ipa (installable with tools that sign it
# with your own Apple ID, such as AltStore or Sideloadly); the App Store needs an Apple developer
# account and signing.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CI: "true"
  # Keep these in sync with mobile.yml and the README.
  TAURI_CLI_VERSION: 2.12.3
  TRUNK_VERSION: 0.21.14

jobs:
  check:
    name: Tag and version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tag is on main and matches the app version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          app=$(python3 -c 'import json; print(json.load(open("apps/app/src-tauri/tauri.conf.json"))["version"])')
          [ "$app" = "${version%%-*}" ] \
            || { echo "::error::tauri.conf.json has version $app, the tag says $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux (x64)
            # The oldest supported runner, so the packages run on older distributions too.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      # linuxdeploy runs without FUSE on the runner.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf file
      # rust-toolchain.toml installs stable with wasm32-wasip2 (the built-in plugins).
      - run: rustup show && rustup target add wasm32-unknown-unknown ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/app
            plugins
          key: release-${{ matrix.target }}
      - name: Install Tauri and Trunk
        run: |
          cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          cargo install trunk --version "=$TRUNK_VERSION" --locked
      - name: Build (includes the Trunk frontend)
        working-directory: apps/app
        run: cargo tauri build --ci --target ${{ matrix.target }}
      - name: Collect the installers
        run: |
          mkdir -p dist
          bundle="apps/app/target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  cli:
    name: CLI ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux (ARM64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rust-toolchain.toml installs stable with wasm32-wasip2 (the built-in plugins).
      - run: rustup show && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            plugins
          key: release-cli-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p locora --target ${{ matrix.target }}
      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          name="locora-cli_${VERSION}_${{ matrix.target }}"
          mkdir -p "$name" dist
          exe=locora
          [ "$RUNNER_OS" = Windows ] && exe=locora.exe
          cp "target/${{ matrix.target }}/release/$exe" LICENSE README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "dist/$name.zip" "$name" > /dev/null
          else
            tar -czf "dist/$name.tar.gz" "$name"
          fi
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS (unsigned)
    needs: check
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Xcode and the iOS SDK
        run: |
          xcodebuild -version
          if ! xcrun simctl list runtimes --json | python3 -c 'import json, sys; sys.exit(not any(r.get("isAvailable") and "iOS" in r["name"] for r in json.load(sys.stdin)["runtimes"]))'; then
            xcodebuild -downloadPlatform iOS
          fi
      - name: Apple project tools
        run: |
          brew install xcodegen
          command -v pod >/dev/null || brew install cocoapods
      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip2 aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/app
            plugins
          key: release-ios
      - name: Install Tauri and Trunk
        run: |
          cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          cargo install trunk --version "=$TRUNK_VERSION" --locked
      - name: Generate the Xcode project
        run: cargo tauri ios init --ci --skip-targets-install
      - name: Build for iPhone and iPad, unsigned (includes the Trunk frontend)
        run: cargo tauri ios build --ci --target aarch64 --no-sign
      - name: Collect the unsigned .ipa
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p ../../dist
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          if [ -n "$ipa" ]; then
            cp "$ipa" "../../dist/Locora_${VERSION}_ios-unsigned.ipa"
          else
            # Older Tauri versions leave only the .app: an .ipa is that app in a Payload folder.
            app=$(find src-tauri/gen/apple/build -type d -name 'Locora.app' | head -1)
            test -n "$app"
            mkdir -p Payload && cp -R "$app" Payload/
            zip -qry "../../dist/Locora_${VERSION}_ios-unsigned.ipa" Payload
          fi
          ls -la ../../dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android (ARM64)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also installs `tools`, which the SDK no longer offers.
          packages: platform-tools
      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip2 aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/app
            plugins
          key: release-android
      - name: Install Tauri and Trunk
        run: |
          cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          cargo install trunk --version "=$TRUNK_VERSION" --locked
      - name: Upload key from the repository secrets
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::warning::No Android upload key in the secrets: the release gets a debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$PASSWORD" "$PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          RELEASE: ${{ steps.key.outputs.signed == 'true' && '1' || '0' }}
          LOCORA_ANDROID_KEYSTORE: ${{ runner.temp }}/keystore.properties
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ./scripts/build-android.sh
          mkdir -p ../../dist
          outputs=src-tauri/gen/android/app/build/outputs
          if [ "$RELEASE" = 1 ]; then
            # Only the installable APK: the Play Store bundle (.aab) stays private, so nobody can upload
            # it under this package name first. Build it locally: RELEASE=1 scripts/build-android.sh
            cp "$outputs/apk/universal/release/app-universal-release.apk" "../../dist/Locora_${VERSION}_android-arm64.apk"
          else
            cp "$outputs/apk/universal/debug/app-universal-debug.apk" "../../dist/Locora_${VERSION}_android-arm64-debug.apk"
          fi
      - name: Remove the key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/keystore.properties"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web app (build)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LOCORA_ZIGBUILD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show && rustup target add wasm32-unknown-unknown wasm32-wasip1 wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            plugins
          key: release-web
      - name: Install Trunk, zig and cargo-zigbuild
        run: |
          cargo install trunk --version "=$TRUNK_VERSION" --locked
          cargo install cargo-zigbuild --version "=0.23.4" --locked
          pip install ziglang==0.17.0
      - name: Plugins as browser modules
        run: |
          cargo build --locked --release --target wasm32-wasip2 --manifest-path plugins/Cargo.toml \
            -p core -p review -p notify -p tutorial -p gamification
          cd apps/web/plugin-host
          npm ci
          node scripts/transpile.mjs ../../../plugins/target/wasm32-wasip2/release/{core,review,notify,tutorial,gamification}.wasm
      - name: Build the web app
        run: |
          (cd apps/web && npm ci)
          node apps/web/build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: apps/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: [check, desktop, cli, ios, android]
    # iOS is unsigned and may fail on new Xcode versions: the release goes out without it then.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.desktop.result == 'success' && needs.cli.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Locora $VERSION" --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*

  netlify:
    name: Web app live on Netlify
    # Only after the release is out. The token lives in the `production` environment, which only
    # tags `v*` may use; it reaches the CLI as an environment variable and never the log.
    needs: [check, web, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://app.locora.cloud
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: dist
      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" && test -n "$NETLIFY_SITE_ID" \
            || { echo "::error::NETLIFY_AUTH_TOKEN (secret) or NETLIFY_SITE_ID (variable) missing in the production environment"; exit 1; }
          npx --yes netlify-cli@27.13.0 deploy --prod --no-build --dir dist --site "$NETLIFY_SITE_ID" \
            --message "Locora $VERSION"
