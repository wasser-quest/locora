name: Release

# A tag `vX.Y.Z` on a commit of `main` builds the app for macOS (Apple silicon and Intel), Windows,
# Linux and Android and publishes them as the GitHub release of that version. Each tag keeps its own
# release; a tag with a suffix (`v0.2.0-beta.1`) becomes a pre-release.
#
# Android is signed with the upload key when the repository secrets ANDROID_KEYSTORE_BASE64
# (`base64 -w0 upload.jks`) and ANDROID_KEYSTORE_PASSWORD are set; without them the release gets
# a debug-signed APK for testing instead. Desktop builds are not code-signed.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CI: "true"
  # Keep these in sync with mobile.yml and the README.
  TAURI_CLI_VERSION: 2.12.3
  TRUNK_VERSION: 0.21.14

jobs:
  check:
    name: Tag and version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The tag is on main and matches the app version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          app=$(python3 -c 'import json; print(json.load(open("apps/app/src-tauri/tauri.conf.json"))["version"])')
          [ "$app" = "${version%%-*}" ] \
            || { echo "::error::tauri.conf.json has version $app, the tag says $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux (x64)
            # The oldest supported runner, so the packages run on older distributions too.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      # linuxdeploy runs without FUSE on the runner.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf file
      # rust-toolchain.toml installs stable with wasm32-wasip2 (the built-in plugins).
      - run: rustup show && rustup target add wasm32-unknown-unknown ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/app
            plugins
          key: release-${{ matrix.target }}
      - name: Install Tauri and Trunk
        run: |
          cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          cargo install trunk --version "=$TRUNK_VERSION" --locked
      - name: Build (includes the Trunk frontend)
        working-directory: apps/app
        run: cargo tauri build --ci --target ${{ matrix.target }}
      - name: Collect the installers
        run: |
          mkdir -p dist
          bundle="apps/app/target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android (ARM64)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip2 aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/app
            plugins
          key: release-android
      - name: Install Tauri and Trunk
        run: |
          cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          cargo install trunk --version "=$TRUNK_VERSION" --locked
      - name: Upload key from the repository secrets
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::warning::No Android upload key in the secrets: the release gets a debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$PASSWORD" "$PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          RELEASE: ${{ steps.key.outputs.signed == 'true' && '1' || '0' }}
          LOCORA_ANDROID_KEYSTORE: ${{ runner.temp }}/keystore.properties
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ./scripts/build-android.sh
          mkdir -p ../../dist
          outputs=src-tauri/gen/android/app/build/outputs
          if [ "$RELEASE" = 1 ]; then
            cp "$outputs/apk/universal/release/app-universal-release.apk" "../../dist/Locora_${VERSION}_android-arm64.apk"
            cp "$outputs/bundle/universalRelease/app-universal-release.aab" "../../dist/Locora_${VERSION}_android-arm64.aab"
          else
            cp "$outputs/apk/universal/debug/app-universal-debug.apk" "../../dist/Locora_${VERSION}_android-arm64-debug.apk"
          fi
      - name: Remove the key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/keystore.properties"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: [check, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Locora $VERSION" --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
