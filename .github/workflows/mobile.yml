name: Mobile builds

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: "true"
  # Keep these in sync with the generated mobile templates and README.
  TAURI_CLI_VERSION: 2.12.3
  TRUNK_VERSION: 0.21.14

jobs:
  android:
    name: Android ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          # The default also installs `tools`, which the SDK no longer offers.
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.13846066"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
      - name: Install Rust targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip2 aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/app
            plugins
      - name: Install Tauri and Trunk
        run: |
          cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          cargo install trunk --version "=$TRUNK_VERSION" --locked
      - name: Build official plugins
        run: cargo build --locked --manifest-path ../../plugins/Cargo.toml --release --target wasm32-wasip2 -p core -p review
      # Generated projects are disposable: the script uses the pinned CLI templates.
      - name: Build debug APK (includes Trunk frontend)
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: locora-android-arm64-debug
          path: apps/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS unsigned simulator app
    # macOS runners on pushes to main and manual runs (free for public repositories).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v7
      - name: Check Xcode and simulator SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes --json | python3 -c 'import json, sys; sys.exit(not any(r.get("isAvailable") and "iOS" in r["name"] for r in json.load(sys.stdin)["runtimes"]))'; then
            xcodebuild -downloadPlatform iOS
          fi
      - name: Install Apple project tools
        run: |
          brew install xcodegen libimobiledevice
          if ! command -v pod >/dev/null; then
            brew install cocoapods
          fi
      - name: Select simulator architecture and install Rust targets
        run: |
          case "$(uname -m)" in
            arm64) target=aarch64-sim; rust_target=aarch64-apple-ios-sim; arch=arm64-sim ;;
            x86_64) target=x86_64; rust_target=x86_64-apple-ios; arch=x86_64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          echo "IOS_TARGET=$target" >> "$GITHUB_ENV"
          echo "IOS_ARCH=$arch" >> "$GITHUB_ENV"
          rustup target add wasm32-unknown-unknown wasm32-wasip2 "$rust_target"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/app
            plugins
      - name: Install Tauri and Trunk
        run: |
          cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          cargo install trunk --version "=$TRUNK_VERSION" --locked
      - name: Build official plugins
        run: cargo build --locked --manifest-path ../../plugins/Cargo.toml --release --target wasm32-wasip2 -p core -p review
      - name: Generate Xcode project
        run: cargo tauri ios init --ci --skip-targets-install
      - name: Build unsigned simulator app (includes Trunk frontend)
        run: cargo tauri ios build --ci --debug --target "$IOS_TARGET" --no-sign
      - name: Package simulator app
        run: |
          app="src-tauri/gen/apple/build/$IOS_ARCH/Locora.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" locora-ios-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: locora-ios-simulator
          path: apps/app/locora-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
