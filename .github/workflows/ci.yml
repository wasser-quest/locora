name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pull requests check Linux only; pushes to main and manual runs also macOS and Windows
  # (free for public repositories).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name != 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml installs stable with rustfmt, clippy and wasm32-wasip2.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (plugins)
        working-directory: plugins
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
      - name: Plugin round trip
        shell: bash
        run: |
          cargo run -q -p locora -- plugin run plugins/target/wasm32-wasip2/release/lernzeit.wasm | tee out.txt
          grep -q "Kachel „Lernzeit“: 1 min" out.txt

  # The Tauri app is its own workspace (needs WebKitGTK). Includes the native
  # WebKitGTK smoke test with the click budgets from PLAN 6.3.
  app:
    name: app (Linux, native smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Tauri + smoke test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xdotool dbus dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0
      - run: rustup show && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/app
            plugins
      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Format
        working-directory: apps/app
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: apps/app
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        working-directory: apps/app
        run: cargo test --workspace
      - name: Build frontend and debug app
        working-directory: apps/app
        run: |
          (cd ui && trunk build)
          cargo build -p locora-app
      - name: Native smoke (WebKitGTK, AT-SPI, click budgets)
        run: apps/app/tests/run_smoke.sh --artifacts "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14
