name: CI

on:
  push:
    # `testing` is checked in full; promote.yml moves `main` to a commit once it passed here, in
    # the web preview and in the mobile builds.
    branches: [main, testing]
  pull_request:
  # Pull requests check Linux only, plus the web app's browser tests; pushes and manual runs also
  # macOS and Windows (free for public repositories).
  workflow_dispatch:

# A newer push to the same branch replaces the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name != 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml installs stable with rustfmt, clippy and wasm32-wasip2.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (plugins)
        working-directory: plugins
        run: cargo clippy -- -D warnings
      # The plugins' own unit tests (e.g. how the game merges the facts of several devices) run
      # natively; the workspace builds for wasm32-wasip2 by default.
      - name: Test (plugins)
        if: runner.os == 'Linux'
        working-directory: plugins
        run: cargo test --target x86_64-unknown-linux-gnu -p core -p review -p notify -p gamification -p competition
      # The contest rules also run in plugins and the browser core, so their tests run on
      # wasm32-wasip2 as well, under a pinned wasmtime.
      - name: Test (contest rules on wasm32-wasip2)
        if: runner.os == 'Linux'
        env:
          WASMTIME_VERSION: 49.0.4
          CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime
        run: |
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/wasmtime-v$WASMTIME_VERSION-x86_64-linux.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/wasmtime-v$WASMTIME_VERSION-x86_64-linux:$PATH"
          wasmtime --version
          cargo test -p locora-competition --target wasm32-wasip2
      - name: Test
        run: cargo test
      - name: Plugin round trip
        shell: bash
        run: |
          cargo run -q -p locora -- plugin run plugins/target/wasm32-wasip2/release/lernzeit.wasm | tee out.txt
          grep -q "Kachel „Lernzeit“: 1 min" out.txt

  # The Tauri app is its own workspace (needs WebKitGTK). Includes the native
  # WebKitGTK smoke test with the click budgets from PLAN 6.3.
  app:
    name: app (Linux, native smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@v7
      - name: System packages (Tauri + smoke test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xdotool dbus dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 ffmpeg \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: rustup show && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/app
            plugins
      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Format
        working-directory: apps/app
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: apps/app
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        working-directory: apps/app
        run: cargo test --workspace
      - name: Build frontend and debug app
        working-directory: apps/app
        run: |
          (cd ui && trunk build)
          cargo build -p locora-app
      - name: Native smoke (WebKitGTK, AT-SPI, click budgets)
        run: apps/app/tests/run_smoke.sh --artifacts "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Web app (browser tests)
    # Pushes to `testing` run these in preview.yml before the preview goes out.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LOCORA_ZIGBUILD: "1"
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show && rustup target add wasm32-unknown-unknown wasm32-wasip1 wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            plugins
          key: pr-web
      - name: Install Trunk, zig and cargo-zigbuild
        run: |
          cargo install trunk --version "=$TRUNK_VERSION" --locked
          cargo install cargo-zigbuild --version "=0.23.4" --locked
          pip install ziglang==0.17.0
      - name: Plugins as browser modules
        run: |
          cargo build --locked --release --target wasm32-wasip2 --manifest-path plugins/Cargo.toml \
            -p core -p review -p notify -p tutorial -p gamification -p competition
          cd apps/web/plugin-host
          npm ci
          node scripts/transpile.mjs ../../../plugins/target/wasm32-wasip2/release/{core,review,notify,tutorial,gamification,competition}.wasm
          npm test
      - name: Build the web app
        run: |
          (cd apps/web && npm ci)
          node apps/web/build.mjs
      - name: Shell tests
        working-directory: apps/web
        run: npm test
      - name: Browser tests
        working-directory: apps/web/e2e
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          npm test
