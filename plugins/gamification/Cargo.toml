[package]
name = "gamification"
description = "XP for due reviews and new loci, a weekly goal, trophies and palace medals for Locora: offline, the same on every device"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
locora-sdk = { path = "../../crates/locora-sdk" }
serde = { version = "1", features = ["derive"] }
