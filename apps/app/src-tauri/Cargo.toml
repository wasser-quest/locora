[package]
name = "locora-app"
description = "Locora desktop and mobile app (Tauri 2 backend)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "locora_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
anyhow = "1"
infer = "0.22"
locora-api = { path = "../../../crates/locora-api" }
locora-app-core = { path = "../../../crates/locora-app-core" }
locora-app-api.workspace = true
locora-cloud-api = { path = "../../../crates/locora-cloud-api" }
locora-crypto = { path = "../../../crates/locora-crypto" }
locora-formula = { path = "../../../crates/locora-formula" }
locora-runtime = { path = "../../../crates/locora-runtime" }
locora-source = { path = "../../../crates/locora-source" }
locora-format = { path = "../../../crates/locora-format" }
locora-store = { path = "../../../crates/locora-store" }
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
splinely_document = { git = "https://github.com/wasser-quest/splinely", tag = "v0.5.2" }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-locora-video = { path = "../plugins/video" }
tempfile = "3"
zeroize = "1"
# The system's secure store for the auto-sync key (see src/keystore.rs).
keyring-core = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain", "protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
