[package]
name = "locora"
description = "Locora command line: memory palaces and plugin development"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "locora"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
locora-formula = { path = "../../crates/locora-formula" }
locora-format = { path = "../../crates/locora-format" }
locora-media = { path = "../../crates/locora-media" }
locora-cloud-api = { path = "../../crates/locora-cloud-api" }
locora-competition = { path = "../../crates/locora-competition" }
locora-signing = { path = "../../crates/locora-signing" }
locora-crypto = { path = "../../crates/locora-crypto" }
locora-runtime = { path = "../../crates/locora-runtime" }
locora-source = { path = "../../crates/locora-source" }
locora-store = { path = "../../crates/locora-store" }
clap.workspace = true
dirs = "6"
rpassword = "7"
locora-api.workspace = true
locora-host.workspace = true
notify.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Ctrl-C during a contest round leaves the alternate screen first (`compete.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
locora-media = { path = "../../crates/locora-media", features = ["fixtures"] }
