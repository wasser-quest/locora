[package]
name = "locora"
description = "Locora command line: memory palaces and plugin development"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "locora"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
locora-formula = { path = "../../crates/locora-formula" }
locora-format = { path = "../../crates/locora-format" }
locora-runtime = { path = "../../crates/locora-runtime" }
locora-source = { path = "../../crates/locora-source" }
locora-store = { path = "../../crates/locora-store" }
clap.workspace = true
dirs = "6"
locora-api.workspace = true
locora-host.workspace = true
notify.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
