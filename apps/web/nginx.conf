# The browser app: files only. The start page and the service worker are always checked against the
# server; the other files may be cached. Frames of the app itself are allowed (SAMEORIGIN).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
        text/javascript mjs;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /index.html { add_header Cache-Control "no-cache" always; }
    location = /sw.js { add_header Cache-Control "no-cache" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "max-age=3600" always;
    }

    location ~ /\. {
        deny all;
    }
}
